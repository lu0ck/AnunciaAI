plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'br.com.anunciaai'
    compileSdk 35

    defaultConfig {
        applicationId "br.com.anunciaai"
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName "5.0"

        // Chaves OAuth/IA: lidas do local.properties (não versionado), vazias por padrão.
        // Preencha: ANUNCIAAI_ML_CLIENT_ID / ANUNCIAAI_ML_CLIENT_SECRET /
        //           ANUNCIAAI_EBAY_CLIENT_ID / ANUNCIAAI_EBAY_CLIENT_SECRET / ANUNCIAAI_QWEN_KEY
        def localProps = new Properties()
        def localPropsFile = rootProject.file("local.properties")
        if (localPropsFile.exists()) {
            localPropsFile.withInputStream { localProps.load(it) }
        }
        buildConfigField "String", "ML_CLIENT_ID", "\"${localProps.getProperty('ANUNCIAAI_ML_CLIENT_ID') ?: ''}\""
        buildConfigField "String", "ML_CLIENT_SECRET", "\"${localProps.getProperty('ANUNCIAAI_ML_CLIENT_SECRET') ?: ''}\""
        buildConfigField "String", "EBAY_CLIENT_ID", "\"${localProps.getProperty('ANUNCIAAI_EBAY_CLIENT_ID') ?: ''}\""
        buildConfigField "String", "EBAY_CLIENT_SECRET", "\"${localProps.getProperty('ANUNCIAAI_EBAY_CLIENT_SECRET') ?: ''}\""
        buildConfigField "String", "QWEN_API_KEY", "\"${localProps.getProperty('ANUNCIAAI_QWEN_KEY') ?: ''}\""
        buildConfigField "String", "GEMINI_KEY", "\"${localProps.getProperty('ANUNCIAAI_GEMINI_KEY') ?: ''}\""
        buildConfigField "String", "NVIDIA_KEY", "\"${localProps.getProperty('ANUNCIAAI_NVIDIA_KEY') ?: ''}\""
        buildConfigField "String", "AI_PROVIDER", "\"${localProps.getProperty('ANUNCIAAI_AI_PROVIDER') ?: ''}\""
    }

    signingConfigs {
        release {
            // Credenciais locais: keystore.properties (gitignored) ou variáveis de ambiente.
            // Nada de senha hardcoded no código (repo é pública).
            def ksProps = new Properties()
            def ksFile = rootProject.file('keystore.properties')
            if (ksFile.exists()) {
                ksFile.withInputStream { ksProps.load(it) }
            }
            def arquivoKs = ksProps.getProperty('storeFile') ?: '../anunciaai.keystore'
            if (file(arquivoKs).exists() || rootProject.file(arquivoKs).exists()) {
                storeFile rootProject.file(arquivoKs)
                storePassword ksProps.getProperty('storePassword') ?: System.getenv('ANUNCIAAI_KS_PASS')
                keyAlias ksProps.getProperty('keyAlias') ?: 'anunciaai'
                keyPassword ksProps.getProperty('keyPassword') ?: System.getenv('ANUNCIAAI_KEY_PASS')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
}

dependencies {
    // Compose
    def composeBom = platform('androidx.compose:compose-bom:2024.10.01')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.navigation:navigation-compose:2.8.4'

    // Room
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'

    // Rede (APIs oficiais + IA)
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-kotlinx-serialization:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'

    // Segurança
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Cores
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

    // Testes
    testImplementation 'junit:junit:4.13.2'
}
